<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <title>Retorno de Inversión Académico • Universidad Dr. Andrés Bello</title>
  <link rel="icon" type="image/png" href="https://unab.edu.sv/wp-content/uploads/2021/04/cropped-favicon-unab-32x32.png">
  <meta name="description" content="Plataforma de Diagnóstico Científico y Retorno de Inversión Académico - Universidad Dr. Andrés Bello (UNAB)">
  <meta name="theme-color" content="#0f172a">
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0f172a;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }
    /* Contenedor Geométrico Anti-Banner (Aísla y suprime el Banner de Apps Script) */
    .portal-viewport-wrapper {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
    }
    /* Iframe Responsivo a Pantalla Completa (100% Viewport) */
    iframe.portal-app-frame {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      border: none;
      display: block;
      margin: 0;
      padding: 0;
      background: #0f172a;
    }
    /* Splash de Carga Institucional Modo Oscuro Ejecutivo */
    #portal-splash-loader {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #0f172a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.4s ease, visibility 0.4s ease;
      color: #FFFFFF;
      padding: 20px;
    }
    .portal-spinner {
      width: 48px;
      height: 48px;
      border: 4px solid rgba(255, 255, 255, 0.15);
      border-top-color: #f59e0b;
      border-radius: 50%;
      animation: portalSpin 0.8s linear infinite;
      margin-bottom: 20px;
    }
    @keyframes portalSpin {
      to { transform: rotate(360deg); }
    }
    .portal-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 12px;
      border-radius: 9999px;
      background: rgba(245, 158, 11, 0.15);
      border: 1px solid rgba(245, 158, 11, 0.3);
      color: #fbbf24;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      margin-bottom: 12px;
    }
  </style>
</head>
<body>
  <!-- Loader Institucional UNAB Modo Oscuro -->
  <div id="portal-splash-loader">
    <div class="portal-badge">
      <span>🏛️</span> Universidad Dr. Andrés Bello
    </div>
    <div class="portal-spinner"></div>
    <div style="font-weight: 800; font-size: 1.15rem; letter-spacing: 0.5px; color: #FFFFFF; text-align: center;">
      Retorno de Inversión Académico
    </div>
    <div style="font-size: 0.82rem; color: #94A3B8; margin-top: 6px; text-align: center; max-width: 320px;">
      Conectando con el Servidor Oficial y Sincronizando Instrumento Psicométrico...
    </div>
  </div>

  <!-- Contenedor Maestro Anti-Banner -->
  <div class="portal-viewport-wrapper">
    <iframe
      id="portal-iframe"
      class="portal-app-frame"
      frameborder="0"
      allowfullscreen
      loading="eager"
      allow="clipboard-write; encrypted-media; camera; microphone"
      onload="ocultarLoaderPortal()">
    </iframe>
  </div>

  <script>
    // URL Base Canónica de Producción de Google Apps Script (Deployment ID Inmutable)
    var GAS_BASE_URL = "https://script.google.com/macros/s/AKfycbyJSddBDXtRthmwhlAhd35924Pgy-ZSXnoYBxccwybSc4RTumxfhIs4QYMGbbHVKJWPjw/exec";

    function inicializarPortal() {
      var iframe = document.getElementById("portal-iframe");
      if (!iframe) return;

      // Obtener parámetros de consulta actuales (?view=resumen, ?view=dashboard, etc.)
      var currentSearch = window.location.search || "";
      var currentHash = window.location.hash || "";

      // Vista predeterminada: view=formulario (acceso directo para estudiantes con menú abierto)
      if (!currentSearch || currentSearch.indexOf("view=") === -1) {
        currentSearch = currentSearch ? (currentSearch + "&view=formulario") : "?view=formulario";
      }

      var destinoFinal = GAS_BASE_URL + currentSearch + currentHash;
      iframe.src = destinoFinal;
    }

    function ocultarLoaderPortal() {
      var loader = document.getElementById("portal-splash-loader");
      if (loader) {
        loader.style.opacity = "0";
        loader.style.visibility = "hidden";
        setTimeout(function() {
          if (loader.parentNode) loader.parentNode.removeChild(loader);
        }, 500);
      }
    }

    // Inicializar navegación inmediatamente
    inicializarPortal();

    // Fallback de seguridad: remover loader tras 4.5 segundos si la conexión es lenta
    setTimeout(ocultarLoaderPortal, 4500);
  </script>
</body>
</html>
